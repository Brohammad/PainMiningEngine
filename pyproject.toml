[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalmine"
version = "0.1.0"
description = "Evidence-backed market intelligence from internet discussions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "build>=1.2",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend"]
pretty = true
show_error_codes = true
warn_unreachable = true
