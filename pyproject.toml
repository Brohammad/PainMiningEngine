[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalmine"
version = "0.1.0"
description = "Evidence-backed market intelligence from internet discussions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "instructor>=1.15.4",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
    "openai>=2.46.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "praw>=8.0.2",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "typer>=0.27.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
signalmine = "backend.app.cli:app"

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=9.1.1",
    "ruff>=0.5",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "backend/app/schemas/contracts"
"prompts" = "backend/app/extractor/prompt_contracts"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend"]
pretty = true
show_error_codes = true
warn_unreachable = true
